<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <p>
            Name:
            <input type="text" name="name">
        </p>

        <p>
            Email:
            <input type="email" name="email">
        </p>

        <p>
            Password:
            <input type="password" name="password">
        </p>

        <p>
            Gender:
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
        </p>

        <p>
            Interests:
            <input type="checkbox" name="interest" value="programming"> Programming
            <input type="checkbox" name="interest" value="web"> Web Development
            <input type="checkbox" name="interest" value="ai"> Artificial Intelligence
        </p>

        <p>
            Department:
            <select name="department">
                <option value="it">Information Technology</option>
                <option value="cs">Computer Science</option>
                <option value="business">Business</option>
                <option value="management">Management</option>
            </select>
        </p>

        <p>
            About You:
            <br>
            <textarea name="about" rows="5" cols="40"></textarea>
        </p>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
